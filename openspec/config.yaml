schema: spec-driven

# Shown to every agent drafting an OpenSpec artifact, on every call: keep it
# to what agents get wrong here, and point to a rule's home, never restate it.

context: |
  sdypy is the umbrella distribution of Structural Dynamics Python. It ships no
  science code: only a lazy facade (sdypy/__init__.py) over six sibling packages
  (EMA, io, FRF, excitation, model, view) plus the sep005 alias.
  openspec/specs/ here holds the org-wide contracts. A sibling's own openspec/
  specs only that package's capabilities and links to hub rules, never restates them.
  AGENTS.md routes to everything; REQUIREMENTS.md maps each requirement to its verifier.

rules:
  proposal:
    - State whether the change is trivial (no behaviour or public-name change) or non-trivial, as AGENTS.md defines it; a trivial change gets no specs.
  specs:
    - One requirement states one verifiable behaviour; split a requirement that bundles several SHALLs.
    - Every requirement body contains SHALL or MUST (validate --strict fails otherwise).
    - New or renamed public names follow docs/source/dev/nomenclature.rst; renames keep a deprecated alias per the public-api spec.
  tasks:
    - "Every new requirement names its verifier for REQUIREMENTS.md: a test, a checker, or a named human judge (who signs off, not only which document to read)."
